<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A romantic love letter — will you be mine?" />
  <title>Will You Be Mine? ❤️</title>

  <!-- Google Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Starfield background canvas -->
  <canvas id="stars-canvas" aria-hidden="true"></canvas>

  <!-- Mouse trail canvas -->
  <canvas id="trail-canvas" aria-hidden="true"></canvas>

  <!-- Ambient floating hearts -->
  <div id="ambient-hearts" class="ambient-hearts" aria-hidden="true"></div>

  <!-- Main Card -->
  <div class="card-wrapper">
    <main class="card">

      <!-- Question View -->
      <div id="question-view">
        <div class="heart-icon" aria-hidden="true">💖</div>
        <h1>Will you be mine?&nbsp;❤️</h1>
        <p class="subtitle" id="subtitle"></p>

        <div class="buttons">
          <button id="btn-yes" class="btn btn-yes" type="button">Yes ❤️</button>
          <button id="btn-no" class="btn btn-no" type="button">No 😭</button>
        </div>

        <div id="dodge-counter" class="dodge-counter">
          Dodged: <span id="dodge-count">0</span> times
        </div>
      </div>

      <!-- Success View -->
      <div id="success-view" class="success-container">
        <div class="success-emoji">🥳</div>
        <h2>YAYYY ❤️</h2>
        <p class="success-sub">You made my day! I'm the luckiest person alive 🥰</p>
        <div class="success-hearts-row">
          <span>💖</span>
          <span>💗</span>
          <span>💕</span>
          <span>💘</span>
          <span>💝</span>
        </div>
      </div>

    </main>
  </div>

  <!-- Heart rain container -->
  <div id="heart-rain" class="heart-rain" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
